spring:
  application:
    name: similar-product-finder
  threads:
    virtual:
      enabled: true

similar-products:
  api:
    base-url: ${SIMILAR_PRODUCTS_API_BASE_URL:http://localhost:3001}
    connect-timeout: ${SIMILAR_PRODUCTS_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${SIMILAR_PRODUCTS_API_READ_TIMEOUT:5s}
  cache:
    enabled: ${SIMILAR_PRODUCTS_CACHE_ENABLED:true}
    ttl: ${SIMILAR_PRODUCTS_CACHE_TTL:5m}

server:
  port: ${SERVER_PORT:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

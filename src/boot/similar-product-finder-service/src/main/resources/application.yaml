spring:
  application:
    name: similar-product-finder

similar-products:
  api:
    base-url: http://localhost:3001

server:
  port: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
